# LiteLLM proxy — every vendor Realytica can reach, and the names it reaches
# them by.
#
# Realytica names three models (extraction, reasoning, judgment) and nothing
# else. This file is where those names become actual vendors, so swapping one
# is an edit here and a restart, with no change to the application.
#
# Add a vendor by adding an entry. The `model_name` is what Realytica asks for;
# `litellm_params.model` is LiteLLM's own `provider/model` id. Keys come from
# the environment (see .env.example), never from this file — it is committed.

model_list:
  # --- The three tiers ----------------------------------------------------
  # Mechanical work: reading a scanned deed into typed fields. Runs once per
  # document rather than once per case and puts whole PDFs into the input, so
  # it is the heaviest agent per case and the one worth pointing somewhere
  # cheap. Claude for now because it is the only model verified to return
  # citations a page reference can be checked against.
  - model_name: realytica-extraction
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # Most of the roster: planning, proof pathways, market research, the
  # orchestrator. Reasoning over material already in hand.
  - model_name: realytica-reasoning
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # The critic, the copilot and the title graph — the three that form an
  # opinion someone will act on.
  - model_name: realytica-judgment
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Alternatives, ready to swap in above -------------------------------
  # Uncomment, set the key in .env, and point a tier at the model_name.
  #
  # Gemini's free tier is the cheapest way to run the extraction tier, and the
  # document DOES survive the hop: measured against this proxy, an
  # Anthropic-format PDF arrives at Gemini as `inline_data`. Citations do NOT —
  # only Claude fills those fields, so a Gemini extraction records a
  # `citations_unavailable` gap and its page references are the model's own
  # word. `pnpm probe:litellm` reports both, separately, per model.
  #
  # Do NOT point a document-reading tier at an `openai/...` model. The same
  # measurement showed the PDF dropped entirely and silently on that path — the
  # model is asked to read a document it was never sent.
  #
  # - model_name: gemini-flash
  #   litellm_params:
  #     model: gemini/gemini-2.5-flash
  #     api_key: os.environ/GEMINI_API_KEY
  #
  # - model_name: deepseek-chat
  #   litellm_params:
  #     model: deepseek/deepseek-chat
  #     api_key: os.environ/DEEPSEEK_API_KEY
  #
  # - model_name: kimi
  #   litellm_params:
  #     model: moonshot/kimi-k2-0905-preview
  #     api_key: os.environ/MOONSHOT_API_KEY
  #
  # A Hugging Face model, through Inference Providers. Point `api_base` at a
  # dedicated Inference Endpoint instead when you have one.
  # - model_name: hf-qwen
  #   litellm_params:
  #     model: huggingface/Qwen/Qwen3-32B
  #     api_key: os.environ/HUGGINGFACE_API_KEY
  #
  # - model_name: local-llama
  #   litellm_params:
  #     model: ollama/llama3.3
  #     api_base: http://host.docker.internal:11434
  #
  # Roughly 150 providers are supported — OpenAI, Azure, Bedrock, Vertex,
  # Groq, Together, Mistral, xAI, Perplexity, Fireworks, Cerebras, SambaNova,
  # Nebius, OpenRouter and the rest. `litellm --help` and the provider docs
  # have the exact `provider/model` spelling; the shape is always the three
  # lines above.

# --- Running on several vendors' free tiers -------------------------------
#
# Two deployments sharing one `model_name` are one pool: LiteLLM picks between
# them, and a deployment that fails is COOLED DOWN and skipped rather than
# retried on every request. Measured against this proxy with a backend rigged
# to return 429 — of four requests, exactly one touched the exhausted key; the
# other three went straight past it. That is the behaviour you want when a
# free quota runs out mid-morning: it costs one request to discover, not one
# per request.
#
# Uncomment these as extra entries in `model_list` above, keeping the tier's
# `model_name` identical. Order does not matter; `rpm` does — it is what lets
# the router steer away from a key BEFORE it 429s.
#
#   - model_name: realytica-reasoning
#     litellm_params:
#       model: gemini/gemini-2.5-flash
#       api_key: os.environ/GEMINI_API_KEY
#       rpm: 10              # the free tier's real ceiling, not a guess
#
#   - model_name: realytica-reasoning
#     litellm_params:
#       model: groq/llama-3.3-70b-versatile
#       api_key: os.environ/GROQ_API_KEY
#       rpm: 30
#
# ONE RULE, and it only binds the extraction tier: every deployment in that
# pool must be able to RECEIVE A DOCUMENT. Measured — an Anthropic-format PDF
# reaches `anthropic/…` as a document block and `gemini/…` as `inline_data`,
# and is dropped, silently and without error, on the way to an `openai/…`
# model. Put a text-only vendor in the extraction pool and the requests that
# happen to land on it read a deed they were never sent. The reasoning and
# judgment tiers take text in and text out, so anything goes there.
#
# Free tiers across DIFFERENT vendors is what this is for. Several accounts at
# one vendor to multiply a single free tier is against most of their terms.

litellm_settings:
  # A vendor outage should degrade the run, not end it. Ordered, and only
  # between models of comparable capability — a fallback that silently drops
  # citations would turn an outage into a quality problem nobody sees.
  num_retries: 2
  request_timeout: 120

  # How a pool treats a deployment that is failing. One failure is enough to
  # stand a key down, because the failure this exists for — an exhausted daily
  # quota — does not recover in a minute, and re-testing it costs a real
  # request every time. Five minutes is long enough to stop hammering it and
  # short enough that a minute-window rate limit heals on its own.
  allowed_fails: 1
  cooldown_time: 300

  # Picks the deployment with the most headroom left against the `rpm`/`tpm`
  # declared above, rather than shuffling blindly into a key that is nearly
  # spent. Needs Redis to be correct across more than one worker — with a
  # single worker the counters are in memory and it is fine as written.
  routing_strategy: usage-based-routing-v2

  # When a whole pool is down — every free key for that tier spent — send the
  # work up a tier rather than failing the run. Costs money; that is the point
  # of it being the last resort and not the first.
  #
  # fallbacks:
  #   - realytica-extraction: ["realytica-reasoning"]
  #   - realytica-reasoning: ["realytica-judgment"]

general_settings:
  # Lets the admin UI at http://localhost:4000/ui add models and their API keys
  # into the database, without editing this file and without a restart. This
  # file is then the checked-in baseline and the UI is how you experiment; a
  # model added there outlives a redeploy because it lives in Postgres.
  #
  # Budgets, rate limits, virtual keys and the spend dashboard are all in that
  # UI too. This file declares what exists, never who may spend on it.
  store_model_in_db: true
